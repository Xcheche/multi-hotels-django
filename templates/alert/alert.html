<!-- Robust Toast Notification System for Django Messages -->

<div id="toast-container" class="fixed top-0 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-2xl p-4 space-y-3 "></div>

<style>
    .toast {
        display: flex;
        flex-direction: column;
        animation: slideDown 0.4s ease-out;
        transition: all 0.3s ease;
    }
    
    .toast:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    
    .toast.closing {
        animation: slideUp 0.3s ease-out forwards;
    }
    
    .toast-content {
        display: flex;
        align-items: flex-end;
        gap: 12px;
    }
    
    .toast-icon {
        font-size: 20px;
        flex-shrink: 0;
        margin-top: 2px;
    }
    
    .toast-text {
        flex: 1;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.4;
    }
    
    .toast-close {
        flex-shrink: 0;
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        padding: 2px 6px;
        margin: -2px -6px 0 0;
        opacity: 0.6;
        transition: opacity 0.2s;
    }
    
    .toast-close:hover {
        opacity: 1;
    }
    
    .toast-progress {
        height: 2px;
        margin-top: 8px;
        border-radius: 1px;
        animation: progressBar linear forwards;
    }
   
    
    /* Color variants */
    .toast.success {
     
        background: linear-gradient(135deg, #2a134a 0%, #818cf8 100%);
        border-left: 4px solid #818cf8;
        color: #ffffff;
    }
    
    .toast.success .toast-progress {
        background: rgba(255, 255, 255, 0.6);
    }
    
    .toast.error {
        background: linear-gradient(135deg, #ff6b6b 0%, #ef4444 100%);
        border-left: 4px solid #dc2626;
        color: #ffffff;
    }
    
    .toast.error .toast-progress {
        background: rgba(255, 255, 255, 0.6);
    }
    
    .toast.warning {
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        border-left: 4px solid #d97706;
        color: #1f2937;
        font-weight: 600;
    }
    
    .toast.warning .toast-progress {
        background: rgba(31, 41, 55, 0.4);
    }
    
    .toast.info {
        background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
        border-left: 4px solid #2563eb;
        color: #ffffff;
    }
    
    .toast.info .toast-progress {
        background: rgba(255, 255, 255, 0.6);
    }
    
    .toast-base {
        padding: 16px 20px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
    }
    
    @keyframes slideDown {
        from {
            transform: translateY(-20px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    @keyframes slideUp {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-20px);
            opacity: 0;
        }
    }
    
    @keyframes progressBar {
        from {
            width: 100%;
        }
        to {
            width: 0%;
        }
    }
</style>

<script>
    // Robust Toast Notification System
    class Toast {
        constructor(message, type = 'info', duration = 8000) {
            this.message = message;
            this.type = type;
            this.duration = duration;
            this.element = null;
            this.timeout = null;
        }
        
        getIcon() {
            const icons = {
                'success': '✓',
                'error': '✕',
                'warning': '⚠',
                'info': 'ℹ',
            };
            return icons[this.type] || icons['info'];
        }
        
        show() {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            this.element = document.createElement('div');
            this.element.className = `toast toast-base ${this.type}`;
            
            const progressBar = this.duration ? `<div class="toast-progress" style="animation-duration: ${this.duration}ms;"></div>` : '';
            
            this.element.innerHTML = `
                <div class="toast-content">
                    <span class="toast-icon">${this.getIcon()}</span>
                    <span class="toast-text">${this.escapeHtml(this.message)}</span>
                    <button class="toast-close" aria-label="Close notification">✕</button>
                </div>
                ${progressBar}
            `;
            
            // Close button handler
            this.element.querySelector('.toast-close').addEventListener('click', () => this.close());
            
            // Click anywhere to close
            this.element.addEventListener('click', (e) => {
                if (e.target !== this.element.querySelector('.toast-close')) {
                    // Don't close on any click, just allow close button
                }
            });
            
            container.appendChild(this.element);
            
            // Auto-dismiss after duration
            if (this.duration) {
                this.timeout = setTimeout(() => this.close(), this.duration);
            }
            
            // Pause auto-dismiss on hover
            this.element.addEventListener('mouseenter', () => {
                if (this.timeout) clearTimeout(this.timeout);
            });
            
            this.element.addEventListener('mouseleave', () => {
                if (this.duration) {
                    this.timeout = setTimeout(() => this.close(), this.duration);
                }
            });
        }
        
        close() {
            if (!this.element) return;
            if (this.timeout) clearTimeout(this.timeout);
            this.element.classList.add('closing');
            setTimeout(() => this.element && this.element.remove(), 300);
        }
        
        escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    }
    
    // Initialize toasts from Django messages on page load
    document.addEventListener('DOMContentLoaded', function() {
        const messages = document.querySelectorAll('[data-message-type]');
        messages.forEach((msg) => {
            const type = msg.dataset.messageType || 'info';
            const text = msg.textContent.trim();
            if (text) {
                // Longer duration for errors and important messages
                const duration = (type === 'error' || type === 'warning') ? 30000 : 20000;
                new Toast(text, type, duration).show();
            }
            msg.remove();
        });
    });
    
    // Expose Toast globally so you can manually show toasts in scripts
    window.showToast = function(message, type = 'info', duration = 7000) {
        new Toast(message, type, duration).show();
    };
</script>

<!-- Django Messages - Hidden storage for toast rendering -->
{% if messages %}
    {% for message in messages %}
        <div data-message-type="{{ message.tags }}" style="display: none;">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
