<div class="mb-3">
    {{ field.label_tag }}
    <div class="password-field position-relative">
        {{ field }}
        <span><i class="ti ti-eye-off passwordToggler"></i></span>
        {% for error in field.errors %}
        <div class="invalid-feedback d-block">{{ error }}</div>
        {% endfor %}
    </div>
</div>
